<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a venue</title>
<style>
  :root { --fg:#1d1d1f; --muted:#5f6368; --bg:#fff; --line:#ccc; }
  @media (prefers-color-scheme: dark) { :root { --fg:#ececec; --muted:#a0a0a0; --bg:#151515; --line:#444; } }
  body { font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  label { display: block; margin: 12px 0 4px; }
  input { font: inherit; width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { font: inherit; margin-top: 16px; padding: 8px 16px; cursor: pointer; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<h1>Org A: book a venue</h1>
<p class="muted">Org A's agent asks Org B's venue agent for a quote, pays it (on a testnet, unless payments are off) and books it. You get Org A's signed receipt of your request. The two orgs each sign their own half of the booking.</p>
<form method="post" action="/book">
  <label for="venue">Venue</label><input id="venue" name="venue" value="Hall 3" required>
  <label for="date">Date</label><input id="date" name="date" type="date" value="2026-11-04" required>
  <label for="people">People</label><input id="people" name="people" type="number" min="1" value="40" required>
  <button type="submit">Book it</button>
</form>
</body>
</html>
