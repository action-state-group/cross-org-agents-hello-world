name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  hops:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install capsulectl (the README's step)
        run: ./scripts/install-capsulectl.sh
      - name: Run hops 1 to 4, the fallback and the one-byte flip
        run: uv run pytest -v
