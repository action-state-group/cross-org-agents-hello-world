name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Pull request runs of one ref replace each other, freeing the organization's shared runners;
  # a run on main gets its own group and is never cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  hops:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The job takes about 1.5 minutes; past 10 it has hung and fails.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: README walkthrough on a fresh clone, timed (limit 15 minutes)
        run: ./scripts/selftest.sh "$GITHUB_WORKSPACE"
      - name: Install capsulectl
        run: ./scripts/install-capsulectl.sh
      - name: Install Chromium for the browser tests
        run: uv run --group browser playwright install --with-deps chromium
      - name: Hops 1 to 4, the fallback, the refusals, and the verify page in a browser
        run: uv run --group browser pytest -v
        env:
          HELLO_REQUIRE_BROWSER: "1"
